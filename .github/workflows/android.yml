name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
      name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu‑latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup‑java@v4
      with:
        java‑version: '11'
        distribution: 'temurin'
        cache: gradle

    # 必须：安装Android SDK！原生模板就有，不要删掉
    - name: Set up Android SDK
      uses: android‑actions/setup‑android‑sdk@v2
      with:
        api‑level: 34
        build‑tools‑version: "34.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (assemble 才是打apk！build会跑测试)
      run: ./gradlew assembleRelease

    # ✅ 正确缩进的上传步骤，是steps下面的一员
    - name: Upload APK
      uses: actions/upload‑artifact@v4
      with:
        name: app‑apk
        path: app/build/outputs/apk/release/*.apk


